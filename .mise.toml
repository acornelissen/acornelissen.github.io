[tools]
ruby = "3.3"

[env]
# Sass reads source as the locale encoding; without UTF-8 it fails on non-ASCII in _base.scss.
LANG = "en_US.UTF-8"
LC_ALL = "en_US.UTF-8"

[tasks."galleries:deps"]
description = "Install the gallery manager's gems"
dir = "{{config_root}}"
env = { BUNDLE_GEMFILE = "bin/gallery-manager/Gemfile" }
run = "bundle check || bundle install"

[tasks.galleries]
description = "Run the local gallery manager"
depends = ["galleries:deps"]
dir = "{{config_root}}"
env = { BUNDLE_GEMFILE = "bin/gallery-manager/Gemfile" }
run = "bundle exec ruby bin/gallery-manager/server.rb"

[tasks.test]
description = "Run the gallery manager test suite"
depends = ["galleries:deps"]
dir = "{{config_root}}"
env = { BUNDLE_GEMFILE = "bin/gallery-manager/Gemfile" }
run = "bundle exec ruby bin/gallery-manager/test/all.rb"
