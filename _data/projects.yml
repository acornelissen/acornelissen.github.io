# Projects shown on /projects.html, in display order.
- name: MRF2
  description: >-
    A LiDAR-powered, multi-format, lens coupled medium-format rangefinder
    camera. The second generation of the IDENTIDEM.design MRF.
  url: https://github.com/acornelissen/IDENTIDEM.design-MRF2
  tech: C++ / ESP32 / 3D printing
  stars: "150+"

- name: TheUnduster
  description: >-
    Finds and removes dust and scratches from scanned film. A local macOS app
    with on-device neural defect detection and LaMa inpainting.
  url: https://github.com/acornelissen/TheUnduster
  tech: Rust / Tauri / Svelte

- name: Two Bells
  description: >-
    Know when to leave. Live trains, buses and trams for your stops in Great
    Britain, with the walk worked out, on an e-paper board by the door and a
    dashboard you run at home.
  url: https://github.com/acornelissen/twobells
  tech: Python / Raspberry Pi / e-paper

- name: HearthMage
  description: >-
    A LAN-only web app to control Farho Nexho and ELKAtherm electric heaters
    over their UDP protocol, with an optional Home Assistant MQTT bridge.
  url: https://github.com/acornelissen/hearthmage
  tech: Python / FastAPI / htmx
